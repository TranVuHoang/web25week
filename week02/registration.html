<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký</title>
  </head>
  <body>
    <form action="thanks.html" method="post">
      <label for="fullname">Họ tên: </label>
      <input
        type="text"
        id="fullname"
        placeholder="fullname..."
        required
      /><br /><br />

      <label for="address">Địa chỉ: </label>
      <input type="text" id="address" placeholder="address..." /><br /><br />

      <label for="email">Email: </label>
      <input type="email" id="email" placeholder="email..." /><br /><br />

      <label for="phone">Phone: </label>
      <input type="number" id="phone" maxlength="15" /><br /><br />

      <label for="">General: </label>
      <input type="radio" name="general" id="male" />
      <label for="male">Male </label>
      <input type="radio" name="general" id="female" />
      <label for="female">Female </label><br /><br />

      <label for="habit">Sở thích:</label>

      <input type="checkbox" id="film" />
      <label for="film">Xem phim</label>

      <input type="checkbox" id="music" />
      <label for="music">Nghe nhạc</label>

      <input type="checkbox" id="game" />
      <label for="game">Chơi game</label><br /><br />

      <label for="">Nghề nghiệp</label>
      <select name="" id="">
        <option value="0">Vui lòng chọn</option>
        <option value="1">Sinh viên</option>
        <option value="2">Freelancer</option>
        <option value="3">IT</option>
      </select>
      <br /><br />

      <label for="username">Username:</label>
      <input type="text" id="username" /><br /><br />

      <label for="password">Password:</label>
      <input type="password" id="password" /><br /><br />

      <label for="more">Thông tin thêm:</label><br />
      <textarea name="" id="" placeholder="Thông tin thêm..."></textarea><br />

      <label for="">Hình đại diện</label>
      <input type="file" /><br /><br />

      <input type="submit" value="Đăng ký" />
      <input type="reset" value="Làm lại" />
    </form>
  </body>
</html>
