<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Thẻ blockquote - trích dẫn -->

      "Trên con đường thành công, không có dấu chân của kẻ lười biêng.
      <br />Phạm Vương
    </blockquote>
    
    <h1>Tin tức</h1>
    <iframe
      src="https://www.youtube.com/watch?v=DbpVWhCkxDM"
      frameborder="0"
      width="500"
      height="500"
    ></iframe>

    <iframe
      width="1091"
      height="589"
      src="https://www.youtube.com/embed/lGoKu1k5qr8"
      title="Lần đầu làm bài test front end dev 2021 || Dev Home || Làm test"
